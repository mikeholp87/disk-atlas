name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned so a newer clippy cannot fail the build unexpectedly; bump deliberately.
  RUST_TOOLCHAIN: 1.99.1

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  package:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Only used for the Maintainer field of the CI-built package.
      DEBFULLNAME: Disk Atlas CI
      DEBEMAIL: ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-package-
      # The binary links only libc, libm and libgcc (graphics and windowing libraries are
      # loaded at run time), so no -dev packages are needed to build.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream lintian
      - name: Build the .deb
        run: |
          # Fixed timestamp so the changelog does not change between identical builds.
          SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct) packaging/build-deb.sh
      - name: Lint the package
        # Advisory: the package still has known gaps (license, AppStream id, no man page).
        continue-on-error: true
        run: lintian --no-tag-display-limit target/deb/*.deb
      - name: Install the package and check the installation
        run: |
          sudo apt-get install -y ./target/deb/diskatlas_*.deb
          test -x /usr/bin/diskatlas
          desktop-file-validate /usr/share/applications/diskatlas.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/diskatlas.svg
          # Every library the binary links against must resolve.
          if ldd /usr/bin/diskatlas | grep 'not found'; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diskatlas-deb
          path: target/deb/*.deb
          if-no-files-found: error
          retention-days: 14
